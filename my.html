<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 신청 내역 | 클럽하와이 설명회 연사 초청</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261127f">
</head>
<body class="my-page">
  <div class="demo-bar" id="demoBar" hidden>시험 모드 — 예시 신청 내역을 보여 드려요.</div>

  <header class="top">
    <div class="top-in">
      <a class="brand" href="./"><img class="brand-logo" src="logo.png" alt="클럽하와이" width="123" height="36"></a>
    </div>
  </header>

  <main class="band my-band">
    <div class="wrap my-wrap">
      <h1 class="lp-h">내 신청 내역</h1>
      <p class="lp-tabs-desc">신청할 때 적은 휴대폰 번호와 원장님 성함을 넣으면 진행 상황을 바로 볼 수 있어요.</p>

      <form class="panel my-form" id="myForm" novalidate>
        <label class="field"><span>휴대폰 번호</span><input name="phone" id="myPhone" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-0000-0000" required></label>
        <label class="field"><span>원장님 성함</span><input name="director" id="myName" autocomplete="name" required></label>
        <button type="submit" class="btn primary" id="myBtn">신청 내역 보기</button>
      </form>

      <div class="my-list" id="myList" aria-live="polite"></div>

      <div class="my-help">
        <p>일정 변경이나 궁금한 점은 카카오톡 클럽하와이cs 채널로 편하게 말씀해 주세요.</p>
        <a class="btn ghost sm" data-contact href="#" target="_blank" rel="noopener">카카오톡 문의</a>
        <a class="btn outline sm" href="./">새 설명회 신청하기</a>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="foot-in foot-info">
      <p class="foot-cs"><b>문의</b>카카오톡 클럽하와이cs 채널</p>
      <p class="foot-copy">© CLUB HAWAII. 학원 설명회 연사 초청 신청</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>
  <script src="config.js?v=20261127f"></script>
  <script src="my.js?v=20261127f"></script>
</body>
</html>
