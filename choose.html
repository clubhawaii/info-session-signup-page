<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>설명회 소장님 선택</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261027a">
  <style>
    .cw { max-width: 560px; margin: 0 auto; padding: 28px 20px 140px; }
    .cw h1 { font-size: 23px; font-weight: 800; }
    .lead2 { margin: 8px 0 0; color: var(--ink-60); font-size: 15px; }
    .when { margin: 16px 0 0; padding: 16px 18px; border-radius: var(--r); background: var(--blue-08); }
    .when small { display: block; font-size: 13px; color: var(--ink-60); font-weight: 600; }
    .when b { font-size: 18px; font-weight: 800; }
    .grp { margin: 22px 0 8px; font-size: 14px; font-weight: 800; color: var(--ink-60); }
    .ans { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: #fff; padding: 14px 16px; margin-bottom: 8px; }
    button.ans:hover { border-color: var(--ink-25); }
    .ans.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; background: var(--blue-08); }
    .ans .a-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .ans .a-body b { font-size: 16px; font-weight: 800; }
    .ans .a-body span { font-size: 13px; color: var(--ink-60); }
    .ans .a-memo { color: var(--ink) !important; font-weight: 600; }
    .ans .radio { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--ink-25); }
    .ans.on .radio { border: 7px solid var(--blue); }
    .ans .badge { flex: none; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--blue); color: #fff; }
    .ans .badge.adj { background: #fff; color: var(--blue); border: 1px solid var(--blue-40); }
    .ans.off { background: none; opacity: .55; }
    .ans.off .badge { background: var(--ink-25); }
    .note { margin-top: 14px; font-size: 13px; color: var(--ink-60); }
    .cbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .cbar .btn { max-width: 520px; margin: 0 auto; display: flex; }
    .result { text-align: center; padding: 60px 0 0; }
    .result .lead { color: var(--ink-60); margin: 10px 0 0; }
    .gray-icon { background: var(--ink); }
  </style>
</head>
<body>
  <div class="demo-bar" id="demoBar" hidden>시험 모드 — 예시 결과이며 선택은 저장되지 않습니다. <a href="./">← 원장님 신청 화면</a></div>
  <header class="top"><div class="top-in"><span class="brand">클럽하와이 <span>설명회 소장님 선택</span></span></div></header>

  <main class="cw" id="app"><p class="empty">결과를 불러오는 중…</p></main>
  <div class="cbar" id="cbar" hidden><button type="button" class="btn primary" id="send" disabled>소장님을 골라 주세요</button></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js?v=20261027a"></script>
  <script src="sample-data.js?v=20261027a"></script>
  <script>
  // 원장님 결과 — 소장님 응답 결과를 알림톡 링크(?t=토큰)로 보고, 가능한 소장님 중 한 분을 고름
  (function () {
    "use strict";
    var C = window.APP_CONFIG || {};
    var DEMO = !C.APPS_SCRIPT_URL;
    var TOKEN = new URLSearchParams(location.search).get("t") || "";
    var DOW = "일월화수목금토";
    var R = null, pick = "", sending = false;
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function krDate(s) { var d = parse(s); return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")"; }
    function krTime(t) { var p = String(t).split(":"), h = +p[0], m = +p[1]; return (h < 12 ? "오전 " : "오후 ") + (h % 12 || 12) + "시" + (m ? " " + m + "분" : ""); }
    function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2400); }

    function load() {
      if (DEMO) return Promise.resolve({ ok: true, result: window.SAMPLE_DATA.result });
      if (!TOKEN) return Promise.resolve({ ok: false, error: "링크가 올바르지 않습니다. 알림톡의 버튼으로 다시 들어와 주세요." });
      return fetch(C.APPS_SCRIPT_URL + "?action=result&t=" + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); });
    }

    function result(icon, title, lead) {
      $("cbar").hidden = true;
      $("app").innerHTML = '<div class="result"><div class="done-icon' + (icon === "x" ? " gray-icon" : "") + '"><svg viewBox="0 0 24 24">' +
        (icon === "x" ? '<path d="M7 7l10 10M17 7 7 17"/>' : '<path d="m5 12.5 4.5 4.5L19 7.5"/>') + "</svg></div><h1>" + esc(title) + '</h1><p class="lead">' + lead + "</p></div>";
    }

    function card(a, can) {
      var adj = a.answer === "시간 조율 필요";
      var inner = '<span class="a-body"><b>' + esc(a.coach) + " 소장님</b><span>" + esc(a.product || "요청사항으로 상의") + "</span>" +
        (a.memo && can ? '<span class="a-memo">소장님 메모: ' + esc(a.memo) + "</span>" : "") + "</span>" +
        '<span class="badge' + (adj ? " adj" : "") + '">' + esc(a.answer) + "</span>";
      return can ? '<button type="button" class="ans" data-coach="' + esc(a.coach) + '">' + inner + '<span class="radio"></span></button>'
        : '<div class="ans off">' + inner + "</div>";
    }

    function render() {
      var r = R;
      var ok = r.answers.filter(function (a) { return a.answer === "가능"; });
      var adj = r.answers.filter(function (a) { return a.answer === "시간 조율 필요"; });
      var no = r.answers.filter(function (a) { return ok.indexOf(a) < 0 && adj.indexOf(a) < 0; });
      $("app").innerHTML =
        "<h1>" + esc(r.director) + " 원장님, 소장님 응답 결과입니다</h1>" +
        '<p class="lead2">진행할 소장님 <b>한 분</b>을 골라 주세요. 고르시면 담당자가 확정 일정과 금액을 안내드립니다.</p>' +
        '<div class="when"><small>' + esc(r.academy) + " · 희망 일정</small><b>" + esc(krDate(r.date)) + " " + esc(krTime(r.time)) + " 시작</b></div>" +
        '<div id="list">' +
        (ok.length ? '<div class="grp">가능 ' + ok.length + "명</div>" + ok.map(function (a) { return card(a, true); }).join("") : "") +
        (adj.length ? '<div class="grp">시간을 조율하면 가능 ' + adj.length + "명</div>" + adj.map(function (a) { return card(a, true); }).join("") : "") +
        "</div>" +
        (no.length ? '<div class="grp">불가 ' + no.length + "명</div>" + no.map(function (a) { return card(a, false); }).join("") : "") +
        '<p class="note">기한 안에 답하지 않은 소장님은 「응답 없음(불가)」로 표시됩니다. 「시간 조율」 소장님을 고르시면 담당자가 시작 시간을 맞춰 연락드립니다.</p>';
      $("cbar").hidden = false;
      $("list").addEventListener("click", function (e) {
        var b = e.target.closest("[data-coach]");
        if (!b) return;
        pick = b.dataset.coach;
        Array.prototype.forEach.call(this.querySelectorAll("[data-coach]"), function (x) { x.classList.toggle("on", x === b); });
        $("send").disabled = false;
        $("send").textContent = pick + " 소장님으로 진행하기";
      });
    }

    $("send").addEventListener("click", function () {
      if (!pick || sending) return;
      sending = true;
      var btn = $("send"), label = btn.textContent;
      btn.disabled = true; btn.textContent = "보내는 중…";
      var body = { action: "choose", t: TOKEN, coach: pick };
      var req = DEMO ? new Promise(function (ok) { setTimeout(function () { ok({ ok: true }); }, 600); })
        : fetch(C.APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
      req.then(function (res) {
        if (!res.ok) throw new Error(res.error || "");
        result("ok", pick + " 소장님으로 전달했습니다", "담당자가 확정 일정과 금액을 안내드리겠습니다.<br>다른 소장님들께는 다른 분으로 진행한다고 알려 드립니다.");
      }).catch(function (e) {
        sending = false; btn.disabled = false; btn.textContent = label;
        toast(e && e.message && !/fetch|network|json/i.test(e.message) ? e.message : "보내지 못했습니다. 잠시 후 다시 시도해 주세요.");
      });
    });

    $("demoBar").hidden = !DEMO;
    load().then(function (d) {
      if (!d.ok) { result("x", "열 수 없는 링크입니다", esc(d.error || "")); return; }
      R = d.result;
      if (R.status === "원장님 선택 대기") { render(); return; }
      if (R.status === "가능한 소장님 없음") { result("x", "가능한 소장님이 없었습니다", "담당자가 다른 날짜나 소장님으로 연락드리겠습니다."); return; }
      if (R.status === "소장님 응답 대기") { result("x", "아직 응답을 기다리고 있습니다", "소장님 응답이 모이면 알림톡으로 다시 알려 드립니다."); return; }
      result("ok", "이미 소장님을 고르셨습니다", (R.chosen ? esc(R.chosen) + " 소장님으로 " : "") + "진행 중입니다. 담당자가 안내드립니다.");
    }).catch(function () { result("x", "불러오지 못했습니다", "잠시 후 다시 열어 주세요."); });
  })();
  </script>
</body>
</html>
