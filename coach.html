<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>설명회 출강 요청</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261029f">
  <style>
    .cw { max-width: 560px; margin: 0 auto; padding: 28px 20px 140px; }
    .cw h1 { font-size: 23px; font-weight: 800; }
    .due { margin: 14px 0 0; padding: 12px 14px; border-radius: var(--r-sm); background: var(--blue-08); font-size: 14px; }
    .due b { color: var(--blue); }
    .when { margin: 14px 0 0; padding: 18px; border-radius: var(--r); border: 1px solid var(--blue-40); }
    .when small { display: block; font-size: 13px; color: var(--ink-60); font-weight: 600; }
    .when b { display: block; font-size: 20px; font-weight: 800; margin-top: 2px; }
    .when .prod { margin-top: 8px; font-size: 15px; font-weight: 700; color: var(--blue); }
    .others { margin: 12px 0 0; padding: 12px 14px; border-radius: var(--r-sm); background: var(--blue-08); font-size: 13px; }
    .others.clash { background: var(--red-12); }
    .others p { margin: 0 0 4px; font-weight: 700; }
    .others ul { margin: 0; padding-left: 18px; }
    .others .hit { color: var(--red); font-weight: 700; }
    .info { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
    .info .rows b { font-weight: 600; max-width: 65%; }
    .opts { display: grid; gap: 8px; margin: 22px 0 0; }
    .opt { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: #fff; padding: 16px 18px; width: 100%; }
    .opt .d { font-size: 17px; font-weight: 700; }
    .opt .t { font-size: 14px; color: var(--ink-60); }
    .opt .radio { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--ink-25); flex: none; }
    .opt.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; background: var(--blue-08); }
    .opt.on .radio { border: 7px solid var(--blue); }
    .memo { margin-top: 12px; }
    .once { margin: 14px 0 0; font-size: 13px; color: var(--ink-60); }
    .notyet { margin: 12px 0 0; padding: 14px 16px; border-radius: var(--r-sm); background: #fff6e0; border: 1px solid #f2d48a; font-size: 14px; line-height: 1.6; }
    .notyet b { display: block; font-size: 15px; margin-bottom: 4px; }
    .memo label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .memo textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; min-height: 84px; outline: none; resize: vertical; }
    .memo textarea:focus { border-color: var(--blue); }
    .cbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .cbar .btn { max-width: 520px; margin: 0 auto; display: flex; }
    .result { text-align: center; padding: 60px 0 0; }
    .result .lead { color: var(--ink-60); margin: 10px 0 0; }
    .gray-icon { background: var(--ink); }
  </style>
</head>
<body>
  <div class="demo-bar" id="demoBar" hidden>시험 모드 — 예시 요청이며 응답은 저장되지 않습니다. <a href="./">← 원장님 신청 화면</a></div>
  <header class="top"><div class="top-in"><span class="brand">클럽하와이 <span>설명회 출강 요청</span></span></div></header>

  <main class="cw" id="app"><p class="empty">요청 내용을 불러오는 중…</p></main>
  <div class="cbar" id="cbar" hidden><button type="button" class="btn primary" id="send" disabled>응답을 골라 주세요</button></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js?v=20261029f"></script>
  <script src="sample-data.js?v=20261029f"></script>
  <script>
  // 소장님 응답 — 알림톡 링크(?t=토큰)로 들어와 「가능 / 불가」 중 하나를 고름
  (function () {
    "use strict";
    var C = window.APP_CONFIG || {};
    var DEMO = !C.APPS_SCRIPT_URL || /[?&]demo\b/.test(location.search);   // ?demo = 예시 요청으로 미리보기(저장 안 됨)
    var HOURS = C.RESPONSE_HOURS || 24;
    var HQ = C.HQ_CONTACT || "010-2939-7909";
    var TOKEN = new URLSearchParams(location.search).get("t") || "";
    var DOW = "일월화수목금토";
    var R = null, choice = null, sending = false;
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function krDate(s) { var d = parse(s); return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")"; }
    function krTime(t) { var p = String(t).split(":"), h = +p[0], m = +p[1]; return (h < 12 ? "오전 " : "오후 ") + (h % 12 || 12) + "시" + (m ? " " + m + "분" : ""); }
    function krDue(d) { return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ") " + krTime(d.getHours() + ":" + d.getMinutes()); }
    function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2400); }

    function load() {
      if (DEMO) return Promise.resolve({ ok: true, request: window.SAMPLE_DATA.request });
      if (!TOKEN) return Promise.resolve({ ok: false, error: "링크가 올바르지 않습니다. 알림톡의 버튼으로 다시 들어와 주세요." });
      return fetch(C.APPS_SCRIPT_URL + "?action=request&t=" + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); });
    }

    function result(icon, title, lead) {
      $("cbar").hidden = true;
      $("app").innerHTML = '<div class="result"><div class="done-icon' + (icon === "x" ? " gray-icon" : "") + '"><svg viewBox="0 0 24 24">' +
        (icon === "x" ? '<path d="M7 7l10 10M17 7 7 17"/>' : '<path d="m5 12.5 4.5 4.5L19 7.5"/>') + "</svg></div><h1>" + esc(title) + '</h1><p class="lead">' + lead + "</p></div>";
    }

    var CHOICES = {
      ok: { d: "가능해요", t: "이 날짜·시간에 진행할 수 있어요", btn: "가능으로 보내기" },
      decline: { d: "이번에는 어려워요", t: "이 일정에는 진행이 어려워요", btn: "불가로 보내기" }
    };

    function render() {
      var r = R;
      var rows = [["학원", r.academy], ["장소", r.venue], ["대상", r.target], ["예상 인원", r.attendees ? r.attendees + "명" : "미정"], ["요청사항", r.request || "없음"]];
      var others = r.others || [], clash = others.some(function (o) { return o.clash; });
      $("app").innerHTML =
        "<h1>" + esc(r.coach) + "님, 설명회 출강 요청이 왔어요</h1>" +
        '<div class="due"><b>' + esc(krDue(new Date(r.deadline))) + "까지</b> 응답해 주세요. (밤·주말 포함 " + HOURS + "시간)<br>기한 안에 응답이 없으면 <b>「불가」로 처리</b>됩니다.</div>" +
        '<div class="notyet" style="margin-top:14px"><b>일정을 먼저 여쭤보는 단계예요.</b>원장님이 최대 세 분께 함께 여쭤보고, 가능하신 분 중 한 분과 확정해요.</div>' +
        '<div class="when"><small>희망 일정</small><b>' + esc(krDate(r.date)) + " " + esc(krTime(r.time)) + ' 시작</b><div class="prod">' + esc(r.product || "설명회 — 요청사항으로 상의") + "</div></div>" +
        // 같은 날 다른 일정 — 시작 시간 앞뒤로 겹치면 빨갛게 (판단은 소장님이)
        (others.length ? '<div class="others' + (clash ? " clash" : "") + '"><p>같은 날 소장님의 다른 일정</p><ul>' + others.map(function (o) {
          return "<li" + (o.clash ? ' class="hit"' : "") + ">" + esc(o.time ? krTime(o.time) : "하루 종일") + " · " + esc(o.state) + (o.academy ? " · " + esc(o.academy) : "") + (o.clash ? " — 시간이 겹쳐요" : "") + "</li>";
        }).join("") + "</ul></div>" : "") +
        '<div class="info"><div class="rows">' + rows.map(function (x) { return "<div><span>" + x[0] + "</span><b>" + esc(x[1]) + "</b></div>"; }).join("") + "</div></div>" +
        '<div class="opts" id="opts">' + Object.keys(CHOICES).map(function (k) {
          return '<button type="button" class="opt" data-c="' + k + '"><span><div class="d">' + CHOICES[k].d + '</div><div class="t">' + CHOICES[k].t + '</div></span><span class="radio"></span></button>';
        }).join("") + "</div>" +
        '<div class="notyet" id="okNote" hidden><b>「가능」이 곧 확정은 아니에요.</b>다른 소장님과 진행될 수도 있어요. 결과는 알림톡으로 알려 드릴게요.</div>' +
        '<div class="memo" id="memo" hidden><label for="memoText" id="memoLabel"></label><textarea id="memoText"></textarea></div>' +
        '<p class="once">한 번 보낸 응답은 바꿀 수 없어요. 바꾸셔야 하면 본사 담당자(<a href="tel:' + HQ.replace(/-/g, "") + '">' + HQ + '</a>)에게 연락해 주세요.</p>';
      $("cbar").hidden = false;
      $("opts").addEventListener("click", function (e) {
        var b = e.target.closest("[data-c]");
        if (!b) return;
        choice = b.dataset.c;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
        $("memo").hidden = choice === "ok";
        $("okNote").hidden = choice !== "ok";
        $("memoLabel").textContent = "사정을 알려 주세요 (선택)";
        $("memoText").placeholder = "예) 그날 지방 일정이 있어요";
        $("send").disabled = false;
        $("send").textContent = CHOICES[choice].btn;
      });
    }

    $("send").addEventListener("click", function () {
      if (!choice || sending) return;
      var memo = $("memoText").value.trim();
      sending = true;
      var btn = $("send"), label = btn.textContent;
      btn.disabled = true; btn.textContent = "보내는 중…";
      var body = { action: "respond", t: TOKEN, choice: choice, memo: memo };
      var req = DEMO ? new Promise(function (ok) { setTimeout(function () { ok({ ok: true }); }, 600); })
        : fetch(C.APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
      req.then(function (res) {
        if (!res.ok) throw new Error(res.error || "");
        var tail = "<br>응답이 모이면 원장님이 24시간 안에 확정하시고, 결과는 알림톡으로 알려 드립니다.";
        if (choice === "ok") result("ok", "가능으로 보냈습니다", esc(krDate(R.date) + " " + krTime(R.time)) + " 가능으로 전달했어요. 감사합니다." + tail);
        else result("ok", "응답을 보냈습니다", "알려 주셔서 감사합니다. 다음 요청 때 다시 연락드리겠습니다.");
      }).catch(function (e) {
        sending = false; btn.disabled = false; btn.textContent = label;
        toast(e && e.message && !/fetch|network|json/i.test(e.message) ? e.message : "보내지 못했습니다. 잠시 후 다시 시도해 주세요.");
      });
    });

    var DONE_MSG = {
      "가능": "가능으로 전달되었습니다. 본사 담당자가 원장님과 조율한 뒤 알려 드립니다.",
      "시간 조율 필요": "시간 조율 필요로 전달되었습니다. 본사 담당자가 원장님과 조율한 뒤 알려 드립니다.",
      "불가": "불가로 전달되었습니다.",
      "확정": "소장님 출강으로 확정되었습니다. 준비에 필요한 내용은 담당자가 연락드립니다.",
      "다른 소장님으로 진행": "이번 설명회는 다른 소장님과 진행하게 되었습니다. 시간 내어 주셔서 감사합니다."
    };
    $("demoBar").hidden = !DEMO;
    load().then(function (d) {
      if (!d.ok) { result("x", "열 수 없는 링크입니다", esc(d.error || "")); return; }
      R = d.request;
      if (DONE_MSG[R.answer]) { result("ok", "이미 응답하신 요청입니다", esc(DONE_MSG[R.answer])); return; }
      if (R.answer !== "응답 대기" || new Date(R.deadline) < new Date()) { result("x", "응답 기한이 지났습니다", "기한 안에 응답이 없어 「불가」로 처리되었습니다. 궁금한 점은 본사 담당자(" + HQ + ")에게 문의해 주세요."); return; }
      render();
    }).catch(function () { result("x", "불러오지 못했습니다", "잠시 후 다시 열어 주세요."); });
  })();
  </script>
</body>
</html>
