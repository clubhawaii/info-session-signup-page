<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>설명회 일정 확인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261026c">
  <style>
    .cw { max-width: 560px; margin: 0 auto; padding: 28px 20px 140px; }
    .cw h1 { font-size: 23px; font-weight: 800; }
    .due { margin: 14px 0 20px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--blue-08); font-size: 14px; }
    .due b { color: var(--blue); }
    .info { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
    .info .rows b { font-weight: 600; max-width: 65%; }
    .opts { display: grid; gap: 8px; margin: 22px 0 0; }
    .opt { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: #fff; padding: 16px 18px; width: 100%; }
    .opt .rk { flex: none; width: 52px; height: 28px; border-radius: 14px; background: var(--blue-08); color: var(--blue); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
    .opt .d { font-size: 17px; font-weight: 700; }
    .opt .t { font-size: 14px; color: var(--ink-60); }
    .opt:disabled { opacity: .45; cursor: not-allowed; }
    .opt .radio { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--ink-25); flex: none; }
    .opt.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
    .opt.on .rk { background: var(--blue); color: #fff; }
    .opt.on .radio { border: 7px solid var(--blue); }
    .opt.adj .rk { background: none; border: 1px solid var(--ink-25); color: var(--ink-60); }
    .opt.adj.on .rk { background: var(--ink); border-color: var(--ink); color: #fff; }
    .opt.adj .d { font-size: 15px; }
    .memo { margin-top: 10px; }
    .memo textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; min-height: 84px; outline: none; resize: vertical; }
    .memo textarea:focus { border-color: var(--blue); }
    .cbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .cbar .btn { max-width: 520px; margin: 0 auto; display: flex; }
    .result { text-align: center; padding: 60px 0 0; }
    .result .lead { color: var(--ink-60); margin: 10px 0 0; }
    .gray-icon { background: var(--ink); }
    .due.flex { margin: 12px 0 0; background: #fff; border: 1px solid var(--blue-40); }
  </style>
</head>
<body>
  <div class="demo-bar" id="demoBar" hidden>시험 모드 — 예시 신청이며 응답은 저장되지 않습니다. <a href="./">← 원장님 신청 화면</a></div>
  <header class="top"><div class="top-in"><span class="brand">클럽하와이 <span>설명회 일정 확인</span></span></div></header>

  <main class="cw" id="app"><p class="empty">신청 내용을 불러오는 중…</p></main>
  <div class="cbar" id="cbar" hidden><button type="button" class="btn primary" id="send" disabled>날짜를 골라 주세요</button></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js?v=20261026c"></script>
  <script src="sample-data.js?v=20261026c"></script>
  <script>
  (function () {
    "use strict";
    var C = window.APP_CONFIG || {};
    var DEMO = !C.APPS_SCRIPT_URL;
    var TOKEN = new URLSearchParams(location.search).get("t") || "";
    var RANKS = ["1순위", "2순위", "3순위"], DOW = "일월화수목금토";
    var R = null, choice = null, sending = false;
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function krDate(s) { var d = parse(s); return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")"; }
    function krTime(t) { var p = String(t).split(":"), h = +p[0], m = +p[1]; return (h < 12 ? "오전 " : "오후 ") + (h % 12 || 12) + "시" + (m ? " " + m + "분" : ""); }
    function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2400); }

    function load() {
      if (DEMO) return Promise.resolve({ ok: true, request: window.SAMPLE_DATA.request });
      if (!TOKEN) return Promise.resolve({ ok: false, error: "링크가 올바르지 않습니다. 알림톡의 버튼으로 다시 들어와 주세요." });
      return fetch(C.APPS_SCRIPT_URL + "?action=request&t=" + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); });
    }

    function result(icon, title, lead) {
      $("cbar").hidden = true;
      $("app").innerHTML = '<div class="result"><div class="done-icon' + (icon === "x" ? " gray-icon" : "") + '"><svg viewBox="0 0 24 24">' +
        (icon === "x" ? '<path d="M7 7l10 10M17 7 7 17"/>' : '<path d="m5 12.5 4.5 4.5L19 7.5"/>') + "</svg></div><h1>" + esc(title) + '</h1><p class="lead">' + lead + "</p></div>";
    }

    function render() {
      var r = R;
      var rows = [["학원", r.academy], ["장소", r.venue || r.address], ["대상", r.target], ["예상 인원", r.attendees ? r.attendees + "명" : "미정"],
        ["설명회", r.kind], ["주제", r.topics], ["요청사항", r.request || "없음"]];
      $("app").innerHTML =
        "<h1>" + esc(r.coach) + "님, 설명회 일정을 골라 주세요</h1>" +
        '<div class="due"><b>24시간 이내에</b> 응답해 주세요. 응답이 없으면 설명회 기회는 다른 강연자께 넘어갑니다.</div>" +
        '<div class="info"><div class="rows">' + rows.map(function (x) { return "<div><span>" + x[0] + "</span><b>" + esc(x[1]) + "</b></div>"; }).join("") + "</div></div>" +
        (r.flexible ? '<div class="due flex">원장님이 <b>강연자님을 1순위로 꼭 희망</b>하셔서, 강연자님 일정에 맞춰 날짜 조정이 가능합니다. 아래 날짜가 어려우시면 「날짜 조율」로 가능한 날짜를 알려 주세요.</div>' : "") +
        '<div class="opts" id="opts">' +
        r.options.map(function (o, i) {
          return '<button type="button" class="opt" data-c="' + i + '"' + (o.blocked ? " disabled" : "") + '><span class="rk">' + RANKS[i] + '</span><span><div class="d">' + esc(krDate(o.date)) + '</div><div class="t">' + esc(krTime(o.time)) + (o.blocked ? " 시작 · 이미 다른 설명회가 확정된 날짜예요" : " 시작") + '</div></span><span class="radio"></span></button>';
        }).join("") +
        '<button type="button" class="opt adj" data-c="adjust"><span class="rk">조율</span><span><div class="d">세 날짜 모두 어려워요</div><div class="t">가능한 날짜를 알려 주시면 본사가 조율합니다</div></span><span class="radio"></span></button>' +
        '<button type="button" class="opt adj" data-c="decline"><span class="rk">불가</span><span><div class="d">이번 설명회는 진행이 어려워요</div><div class="t">지역·주제 등 사정을 알려 주세요</div></span><span class="radio"></span></button>' +
        "</div>" +
        '<div class="memo" id="memo" hidden><textarea id="memoText"></textarea></div>';
      $("cbar").hidden = false;
      $("opts").addEventListener("click", function (e) {
        var b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        choice = b.dataset.c;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
        var memo = choice === "adjust" || choice === "decline";
        $("memo").hidden = !memo;
        $("memoText").placeholder = choice === "adjust" ? "가능한 날짜와 시간을 적어 주시면 조율이 빨라집니다." : "진행이 어려운 사정을 적어 주세요. (선택)";
        var btn = $("send");
        btn.disabled = false;
        btn.textContent = choice === "adjust" ? "날짜 조율로 보내기" : choice === "decline" ? "진행 불가로 보내기" : RANKS[+choice] + " " + krDate(r.options[+choice].date) + " 가능";
      });
    }

    $("send").addEventListener("click", function () {
      if (choice === null || sending) return;
      sending = true;
      var btn = $("send"), label = btn.textContent;
      btn.disabled = true; btn.textContent = "보내는 중…";
      var body = { action: "respond", t: TOKEN, choice: choice, memo: $("memoText").value.trim() };
      var req = DEMO ? new Promise(function (ok) { setTimeout(function () { ok({ ok: true }); }, 600); })
        : fetch(C.APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
      req.then(function (res) {
        if (!res.ok) throw new Error(res.error || "");
        if (choice === "adjust") result("ok", "조율 요청을 보냈습니다", "본사 담당자가 곧 연락드리겠습니다.");
        else if (choice === "decline") result("ok", "응답을 보냈습니다", "알려 주셔서 감사합니다. 다음 설명회 때 다시 연락드리겠습니다.");
        else { var o = R.options[+choice]; result("ok", "응답을 보냈습니다", esc(krDate(o.date) + " " + krTime(o.time)) + " 가능으로 전달했습니다.<br>본사 담당자가 원장님과 확정한 뒤 연락드리겠습니다."); }
      }).catch(function (e) {
        sending = false; btn.disabled = false; btn.textContent = label;
        toast(e && e.message && !/fetch|network|json/i.test(e.message) ? e.message : "보내지 못했습니다. 잠시 후 다시 시도해 주세요.");
      });
    });

    $("demoBar").hidden = !DEMO;
    load().then(function (d) {
      if (!d.ok) { result("x", "열 수 없는 링크입니다", esc(d.error || "")); return; }
      R = d.request;
      if (["강연자 수락", "일정확정", "결제안내", "결제완료", "진행완료"].indexOf(R.status) >= 0) { var o = R.options[R.chosen]; result("ok", "이미 응답하신 요청입니다", o ? esc(krDate(o.date) + " " + krTime(o.time)) + " 가능으로 전달되었습니다." : ""); return; }
      if (R.status === "조율 필요" || R.status === "강연자 불가") { result("ok", "이미 응답하신 요청입니다", "본사 담당자가 연락드릴 예정입니다."); return; }
      if (R.status !== "강연자 확인중" || new Date(R.deadline) < new Date()) { result("x", "응답 기한이 지났습니다", "이 요청은 다른 강연자께 넘어갔습니다. 궁금한 점은 본사로 문의해 주세요."); return; }
      render();
    }).catch(function () { result("x", "불러오지 못했습니다", "잠시 후 다시 열어 주세요."); });
  })();
  </script>
</body>
</html>
